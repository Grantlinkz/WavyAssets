# ==============================================================================
# WavyAssets Global Institutional Platform — Unified Monorepo Docker Compose
# ==============================================================================
# Full Multi-Tier Platform Topology:
# 1. Landing Page Backend:     NestJS API Gateway & Showcase Telemetry (:4000)
# 2. Landing Page Frontend:    React 19 / Vite 8 / Three.js Showcase via Nginx (:5173)
# 3. User Dashboard Backend:   Transactional Core & Double-Entry Ledger (:4001)
# 4. User Dashboard Frontend:  Sovereign Command Deck & Smartsupp Concierge (:5174)
# 5. Admin Panel Backend:      Supreme Admin Deck & Treasury Operations (:4002)
# 6. Admin Panel Frontend:     Operational Command Terminal via Nginx (:5175)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Landing Page Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./Backend/landing-page
      dockerfile: Dockerfile
      target: runner
    image: wavyassets/landing-page-backend:1.0.0
    container_name: wavyassets-landing-backend
    restart: unless-stopped
    ports:
      - "${LANDING_BACKEND_PORT:-${BACKEND_PORT:-4000}}:4000"
    env_file:
      - ./Backend/landing-page/.env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=file:./dev.db
      - APP_URL=http://localhost:4000
      - CLIENT_URL=http://localhost:5173
      - DASHBOARD_URL=http://localhost:5174
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_sqlite_data:/app/prisma
    networks:
      wavyassets-network:
        aliases:
          - backend-landing
          - wavyassets-landing-backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 2. Landing Page Frontend Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./Frontend/landing-page
      dockerfile: Dockerfile
      target: runner
    image: wavyassets/landing-page-frontend:1.0.0
    container_name: wavyassets-landing-frontend
    restart: unless-stopped
    ports:
      - "${LANDING_FRONTEND_PORT:-${FRONTEND_PORT:-5173}}:80"
    environment:
      - PORT=80
      - BACKEND_HOST=wavyassets-landing-backend
      - BACKEND_PORT=4000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      wavyassets-network:
        aliases:
          - landing-frontend
          - wavyassets-landing-frontend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 3. User Dashboard Backend Service
  # ----------------------------------------------------------------------------
  backend-user-dashboard:
    build:
      context: ./Backend/user-dashboard
      dockerfile: Dockerfile
      target: runner
    image: wavyassets/user-dashboard-backend:1.0.0
    container_name: wavyassets-backend-user-dashboard
    restart: unless-stopped
    ports:
      - "${USER_DASHBOARD_BACKEND_PORT:-${BACKEND_DASHBOARD_PORT:-4001}}:4000"
    env_file:
      - ./Backend/user-dashboard/.env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=file:./dev.db
    command: sh -c "npx prisma db push --skip-generate && node dist/src/main.js"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_dashboard_sqlite_data:/app/prisma
    networks:
      wavyassets-network:
        aliases:
          - user-dashboard-backend
          - wavyassets-backend-user-dashboard
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 4. User Dashboard Frontend Service
  # ----------------------------------------------------------------------------
  dashboard:
    build:
      context: ./Frontend/user-dashboard
      dockerfile: Dockerfile
      target: runner
    image: wavyassets/user-dashboard:1.0.0
    container_name: wavyassets-user-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_FRONTEND_PORT:-${DASHBOARD_PORT:-5174}}:80"
    environment:
      - PORT=80
      - BACKEND_HOST=wavyassets-backend-user-dashboard
      - BACKEND_PORT=4000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend-user-dashboard:
        condition: service_healthy
    networks:
      wavyassets-network:
        aliases:
          - user-dashboard-frontend
          - wavyassets-user-dashboard
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 5. Supreme Admin Panel Backend Service
  # ----------------------------------------------------------------------------
  backend-admin-panel:
    build:
      context: ./Backend/admin-panel
      dockerfile: Dockerfile
      target: runner
    image: wavyassets/admin-panel-backend:1.0.0
    container_name: wavyassets-backend-admin-panel
    restart: unless-stopped
    ports:
      - "${ADMIN_BACKEND_PORT:-4002}:4002"
    env_file:
      - ./Backend/admin-panel/.env
    environment:
      - NODE_ENV=production
      - PORT=4002
      - DATABASE_URL=file:./dev.db
    command: sh -c "npx prisma db push --skip-generate && node dist/src/main.js"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - backend_admin_sqlite_data:/app/prisma
    networks:
      wavyassets-network:
        aliases:
          - admin-panel-backend
          - wavyassets-backend-admin-panel
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4002/api/v1/overview/summary || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 6. Supreme Admin Panel Frontend Service
  # ----------------------------------------------------------------------------
  admin-panel:
    build:
      context: ./Frontend/admin-panel
      dockerfile: Dockerfile
      target: runner
    image: wavyassets/admin-panel-frontend:1.0.0
    container_name: wavyassets-admin-frontend
    restart: unless-stopped
    ports:
      - "${ADMIN_FRONTEND_PORT:-5175}:80"
    environment:
      - PORT=80
      - BACKEND_HOST=wavyassets-backend-admin-panel
      - BACKEND_PORT=4002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend-admin-panel:
        condition: service_healthy
    networks:
      wavyassets-network:
        aliases:
          - admin-panel-frontend
          - wavyassets-admin-frontend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_sqlite_data:
    name: wavyassets_landing_backend_data
    driver: local
  backend_dashboard_sqlite_data:
    name: wavyassets_dashboard_backend_data
    driver: local
  backend_admin_sqlite_data:
    name: wavyassets_admin_backend_data
    driver: local

networks:
  wavyassets-network:
    name: wavyassets_institutional_network
    driver: bridge
