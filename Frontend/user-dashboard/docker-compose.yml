# ==============================================================================
# WavyAssets Global Institutional User Dashboard — Docker Compose Configuration
# ==============================================================================

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: wavyassets/user-dashboard:1.0.0
    container_name: wavyassets-user-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-5174}:80"
    environment:
      - PORT=80
      - BACKEND_HOST=${BACKEND_HOST:-wavyassets-backend-user-dashboard}
      - BACKEND_PORT=${BACKEND_PORT:-4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wavyassets-dashboard-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${PORT:-80}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  wavyassets-dashboard-network:
    name: wavyassets_dashboard_frontend_network
    driver: bridge
