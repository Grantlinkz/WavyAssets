<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Invest in stocks online, grow with smart automated investing, browse classic cars, and manage cash in one secure digital money wallet."
    />
    <title>
      WavyAssets — Smart Multi-Asset Wealth &amp; Digital Money Wallet
    </title>

    <!-- Google Fonts: Noto Serif & Inter for Global Tabular Engine -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-surface font-body-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container min-h-screen"
  >
    <div id="root">
      <!-- WavyAssets Institutional Favicon Preloader (Instant 0ms Splash Screen) -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #08090B; color: #D4AF37; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
        <div style="position: relative; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center;">
          <!-- Rotating Orbital Conduit -->
          <div style="position: absolute; inset: -10px; border-radius: 22px; border: 2px solid transparent; border-top-color: #D4AF37; border-right-color: #00C288; animation: wavy-preloader-spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;"></div>
          <!-- WavyAssets Favicon with Breathing Pulse -->
          <img src="/favicon.svg" alt="Loading WavyAssets..." width="48" height="48" style="animation: wavy-preloader-pulse 2s ease-in-out infinite; filter: drop-shadow(0 0 14px rgba(212, 175, 55, 0.4));" />
        </div>
        <div style="margin-top: 26px; font-size: 11px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #8F96A3; font-family: 'JetBrains Mono', monospace;">
          Loading WavyAssets...
        </div>
        <style>
          @keyframes wavy-preloader-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
          @keyframes wavy-preloader-pulse {
            0%, 100% { transform: scale(0.96); opacity: 0.85; filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.3)); }
            50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 0 18px rgba(212, 175, 55, 0.6)); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
