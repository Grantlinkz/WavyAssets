# ==============================================================================
# WavyAssets Landing Page Frontend — Local Development Compose Override
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# ==============================================================================

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: wavyassets-landing-frontend-dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_BACKEND_ORIGIN=http://wavyassets-landing-backend:4000
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./postcss.config.mjs:/app/postcss.config.mjs
      - ./components.json:/app/components.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.app.json:/app/tsconfig.app.json
      - ./tsconfig.node.json:/app/tsconfig.node.json
      - /app/node_modules
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1G
