# ==============================================================================
# WavyAssets Landing Page Frontend — Institutional Docker Compose Configuration
# ==============================================================================

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: wavyassets/landing-page-frontend:1.0.0
    container_name: wavyassets-landing-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      - PORT=80
      - BACKEND_HOST=${BACKEND_HOST:-wavyassets-landing-backend}
      - BACKEND_PORT=${BACKEND_PORT:-4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wavyassets-landing-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${PORT:-80}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  wavyassets-landing-network:
    name: wavyassets_landing_frontend_network
    driver: bridge
