# ==============================================================================
# WavyAssets Supreme Institutional Admin Panel Backend — Standalone Compose
# ==============================================================================

services:
  backend-admin-panel:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: wavyassets/admin-panel-backend:1.0.0
    container_name: wavyassets-backend-admin-panel
    restart: unless-stopped
    # Production Hardening: Bind internal API ports to host loopback (127.0.0.1) only
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${PORT:-4002}:4002"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4002
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL environment variable is required}
    # Production Hardening: exec ensures tini directly supervises node for immediate SIGTERM handling
    command: sh -c "npx prisma db push --skip-generate && exec node dist/src/main.js"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - wavyassets-admin-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${PORT:-4002}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  wavyassets-admin-network:
    name: wavyassets_admin_network
    driver: bridge
