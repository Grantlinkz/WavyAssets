services:
  backend-user-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wavyassets-backend-user-dashboard
    restart: unless-stopped
    ports:
      - "4001:4000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-file:./dev.db}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - HANDOFF_TICKET_SECRET=${HANDOFF_TICKET_SECRET}
      - ENCRYPTION_KEY_HEX=${ENCRYPTION_KEY_HEX}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost:5173,http://localhost:5174}
    command: sh -c "npx prisma db push --skip-generate && node dist/src/main.js"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - dashboard_data:/app/prisma

volumes:
  dashboard_data:

