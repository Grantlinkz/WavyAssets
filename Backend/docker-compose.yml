# ==============================================================================
# WavyAssets Backend Microservices Stack — Unified Backend Compose
# ==============================================================================
# Services:
# - postgres:                PostgreSQL 16 Alpine Relational Database (:5432)
# - backend-landing:         Landing Page API & WebSocket Gateway (:4000)
# - backend-user-dashboard:  User Dashboard Transaction Core & Ledger (:4001)
# - backend-admin-panel:     Supreme Admin Panel & Treasury Operations (:4002)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Enterprise Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: wavyassets-backend-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wavyassets}
    volumes:
      - backend_postgres_data:/var/lib/postgresql/data
    networks:
      wavyassets-backend-network:
        aliases:
          - postgres
          - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wavyassets} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Landing Page Backend
  # ----------------------------------------------------------------------------
  backend-landing:
    build:
      context: ./landing-page
      dockerfile: Dockerfile
      target: runner
    image: wavyassets/landing-page-backend:1.0.0
    container_name: wavyassets-landing-backend
    restart: unless-stopped
    # Production Hardening: Bind internal API ports to host loopback (127.0.0.1) only
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${LANDING_BACKEND_PORT:-4000}:4000"
    env_file:
      - ./landing-page/.env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/wavyassets?schema=public}
    # Production Hardening: exec ensures tini directly supervises node for immediate SIGTERM handling
    command: sh -c "npx prisma db push --skip-generate && exec node dist/main.js"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      wavyassets-backend-network:
        aliases:
          - backend
          - backend-landing
          - wavyassets-landing-backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${PORT:-4000}/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # User Dashboard Backend
  # ----------------------------------------------------------------------------
  backend-user-dashboard:
    build:
      context: ./user-dashboard
      dockerfile: Dockerfile
      target: runner
    image: wavyassets/user-dashboard-backend:1.0.0
    container_name: wavyassets-backend-user-dashboard
    restart: unless-stopped
    # Production Hardening: Bind internal API ports to host loopback (127.0.0.1) only
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${USER_DASHBOARD_BACKEND_PORT:-4001}:4000"
    env_file:
      - ./user-dashboard/.env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/wavyassets?schema=public}
    # Production Hardening: exec ensures tini directly supervises node for immediate SIGTERM handling
    command: sh -c "npx prisma db push --skip-generate && exec node dist/src/main.js"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      wavyassets-backend-network:
        aliases:
          - backend-user-dashboard
          - user-dashboard-backend
          - wavyassets-backend-user-dashboard
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${PORT:-4000}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Supreme Admin Panel Backend
  # ----------------------------------------------------------------------------
  backend-admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
      target: runner
    image: wavyassets/admin-panel-backend:1.0.0
    container_name: wavyassets-backend-admin-panel
    restart: unless-stopped
    # Production Hardening: Bind internal API ports to host loopback (127.0.0.1) only
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:${ADMIN_BACKEND_PORT:-4002}:4002"
    env_file:
      - ./admin-panel/.env
    environment:
      - NODE_ENV=production
      - PORT=4002
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/wavyassets?schema=public}
    # Production Hardening: exec ensures tini directly supervises node for immediate SIGTERM handling
    command: sh -c "npx prisma db push --skip-generate && exec node dist/src/main.js"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      wavyassets-backend-network:
        aliases:
          - backend-admin-panel
          - admin-panel-backend
          - wavyassets-backend-admin-panel
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:$${PORT:-4002}/api/v1/overview/summary || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_postgres_data:
    name: wavyassets_backend_postgres_data
    driver: local

networks:
  wavyassets-backend-network:
    name: wavyassets_backend_internal_network
    driver: bridge
