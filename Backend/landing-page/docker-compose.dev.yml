# ==============================================================================
# WavyAssets Landing Page Backend — Local Development Compose Override
# ==============================================================================
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: wavyassets-landing-backend-dev
    command: npm run start:dev
    environment:
      - NODE_ENV=development
      - DEV_CONSOLE_OTP_FALLBACK=true
      - DEV_STATIC_OTP=123456
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
      - ./nest-cli.json:/app/nest-cli.json
      - /app/node_modules
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
