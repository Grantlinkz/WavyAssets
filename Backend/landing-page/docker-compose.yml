# ==============================================================================
# WavyAssets Landing Page Backend — Standalone Docker Compose Configuration
# ==============================================================================
# Specification:
# - High-availability NestJS API Gateway & WebSocket Telemetry Server
# - SQLite / PostgreSQL Database Connection with volume persistence
# - Non-root execution security & integrated liveness/readiness probes
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: wavyassets/landing-page-backend:1.0.0
    container_name: wavyassets-landing-backend
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-file:./dev.db}
      - APP_URL=${APP_URL:-http://localhost:4000}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - DASHBOARD_URL=${DASHBOARD_URL:-http://localhost:5174}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - landing_backend_sqlite_data:/app/prisma
    networks:
      - wavyassets-landing-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  landing_backend_sqlite_data:
    name: wavyassets_landing_backend_data
    driver: local

networks:
  wavyassets-landing-network:
    name: wavyassets_landing_network
    driver: bridge
